<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Links</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#172033;transition:background .18s,color .18s}button,input{font:inherit;padding:11px 13px;border:1px solid #dfe3ed;border-radius:10px}button{cursor:pointer;background:white;color:inherit;font-weight:650}.primary{background:#5b5ce2;color:white;border-color:#5b5ce2}.hidden{display:none!important}.panel{max-width:1000px;margin:35px auto;padding:24px}.box{background:white;border:1px solid #e1e5ef;border-radius:18px;padding:22px;box-shadow:0 10px 30px #1520440c}.auth{max-width:420px;margin:10vh auto}.field{display:grid;gap:7px;margin:14px 0}.field input{width:100%}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row input[type=search]{flex:1;min-width:200px}.cats{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:18px}.card{background:white;border:1px solid #e1e5ef;border-radius:15px;padding:17px;overflow-wrap:anywhere;transition:opacity .15s,border-color .15s}.card h3{margin:8px 0}.card a{color:#3435b8}.muted{color:#667085}.msg{margin-top:12px;font-size:14px}.error{color:#b42318}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:5px}.actions button{padding:5px 8px}.modal{max-width:500px}.dialog{position:fixed;inset:0;background:#11182777;display:grid;place-items:center;padding:15px}.dialog .box{width:min(500px,100%)}.drag-handle{cursor:grab;user-select:none}.card.dragging{opacity:.4}.card.drop-target{border:2px dashed #7778}.reorder-note{font-size:13px;margin-top:8px}@media(max-width:600px){.panel{margin:10px auto;padding:12px}}
body.dark{background:#111521;color:#e7eaf3}body.dark .box,body.dark .card{background:#1b2130;border-color:#343c50;box-shadow:0 10px 30px #0003}body.dark button,body.dark input{background:#242b3c;color:#e7eaf3;border-color:#3b455b}body.dark button.primary{background:#6366f1;color:#fff;border-color:#6366f1}body.dark .card a{color:#a5b4fc}body.dark .muted{color:#a8b2c7}body.dark .error{color:#ff9c9c}body.dark .dialog{background:#000b}
</style></head><body>
<section id="login" class="panel auth box"><div class="top"><h1>↗ My Links</h1><button id="themeLogin" type="button">☾ Dark mode</button></div><p class="muted">Sign in to access your bookmarks across devices.</p>
<form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="primary" type="submit">Sign in</button></form><p id="msg" class="msg muted">Use the Supabase user you created.</p></section>
<main id="app" class="panel hidden"><div class="top"><div><h1>↗ My Links</h1><p class="muted">Your bookmarks, synced across devices.</p></div><div class="row"><button id="theme" type="button">☾ Dark mode</button><button id="add">＋ Add link</button><button id="logout">Sign out</button></div></div><div class="row"><input id="search" type="search" placeholder="Search links…"></div><div id="cats" class="cats"></div><div id="count" class="muted"></div><div id="reorderNote" class="muted reorder-note hidden">Tip: drag a bookmark card to change its order within this category. The order is saved automatically.</div><div id="cards" class="cards"></div></main>
<div id="editor" class="dialog hidden"><form id="linkForm" class="box modal"><h2 id="formTitle">Add link</h2><div class="field"><label for="name">Website name</label><input id="name" required></div><div class="field"><label for="url">URL</label><input id="url" required placeholder="https://example.com"></div><div class="field"><label for="description">Description</label><input id="description"></div><div class="field"><label for="category">Category</label><input id="category" list="catOptions" value="General" required><datalist id="catOptions"></datalist></div><div class="field"><label for="icon">Icon / emoji</label><input id="icon" maxlength="4" placeholder="★"></div><label><input id="favorite" type="checkbox"> Pin to favorites</label><div class="row" style="justify-content:flex-end;margin-top:16px"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save link</button></div></form></div>
<script>
const SUPABASE_URL="https://fzcnfozrwkifvbhuirfo.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_cGn1DnBrPShoaW7qwo0elA_uhaikf87";
let db,items=[],category="All",editing=null,user=null,draggedId=null;
const $=id=>document.getElementById(id);
function say(s,cls="muted"){$("msg").className="msg "+cls;$("msg").textContent=s}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function urlSafe(s){try{let u=new URL(s);return ["http:","https:"].includes(u.protocol)?u.href:"#"}catch{return "#"}}
function applyTheme(){const dark=localStorage.getItem("my-links-theme")==="dark";document.body.classList.toggle("dark",dark);["theme","themeLogin"].forEach(id=>{if($(id))$(id).textContent=dark?"☀ Light mode":"☾ Dark mode"})}
function toggleTheme(){const dark=document.body.classList.toggle("dark");localStorage.setItem("my-links-theme",dark?"dark":"light");applyTheme()}
$("theme").onclick=toggleTheme;$("themeLogin").onclick=toggleTheme;applyTheme();
function setup(){if(!window.supabase)throw Error("Supabase library failed to load. Check your internet connection.");if(SUPABASE_URL.includes("PASTE_")||SUPABASE_PUBLISHABLE_KEY.includes("PASTE_"))throw Error("Add your Project URL and Publishable key in the setup section of this HTML file.");db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY)}
function view(on){$("login").classList.toggle("hidden",on);$("app").classList.toggle("hidden",!on)}
async function boot(){try{setup();const {data,error}=await db.auth.getSession();if(error)throw error;if(data.session){user=data.session.user;view(true);await load()}else view(false);db.auth.onAuthStateChange(async(_,s)=>{if(s){user=s.user;view(true);await load()}else{user=null;items=[];view(false)}})}catch(e){view(false);say(e.message,"error")}}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{if(!db)setup();say("Signing in…");const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)throw error}catch(err){say(err.message,"error")}};
$("logout").onclick=async()=>{if(db)await db.auth.signOut()};
async function load(){const {data,error}=await db.from("bookmarks").select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:false});if(error){alert("Could not load bookmarks: "+error.message);return}items=data||[];render()}
function cats(){return ["All","Favorites",...[...new Set(items.map(x=>x.category||"General"))].sort()]}
function render(){const q=$("search").value.trim().toLowerCase();const canReorder=category!=="All"&&category!=="Favorites"&&!q;$("reorderNote").classList.toggle("hidden",!canReorder);$("cats").innerHTML=cats().map(c=>`<button data-c="${esc(c)}" class="${category===c?"primary":""}">${c==="Favorites"?"★ ":""}${esc(c)} (${c==="All"?items.length:c==="Favorites"?items.filter(x=>x.favorite).length:items.filter(x=>x.category===c).length})</button>`).join("");document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{category=b.dataset.c;render()});let rows=items.filter(x=>(category==="All"||(category==="Favorites"?x.favorite:x.category===category))&&(!q||[x.name,x.url,x.description,x.category].join(" ").toLowerCase().includes(q)));if(category!=="All"&&category!=="Favorites"&&!q)rows.sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||String(b.created_at||"").localeCompare(String(a.created_at||"")));$("count").textContent=`${rows.length} link${rows.length===1?"":"s"}`;$("catOptions").innerHTML=[...new Set(items.map(x=>x.category))].map(c=>`<option value="${esc(c)}">`).join("");$("cards").innerHTML=rows.length?rows.map(x=>`<article class="card" data-id="${x.id}" ${canReorder?'draggable="true"':''}><div class="top"><strong>${canReorder?'<span class="drag-handle" title="Drag to reorder">⠿ </span>':''}${esc(x.icon||"↗")} ${esc(x.category)}</strong><div class="actions"><button onclick="fav(${x.id})" title="Favorite">${x.favorite?"★":"☆"}</button><button onclick="edit(${x.id})" title="Edit">✎</button><button onclick="del(${x.id})" title="Delete">×</button></div></div><h3><a href="${urlSafe(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.name)}</a></h3><p class="muted">${esc(x.description||"")}</p><small class="muted">${esc(x.url)}</small></article>`).join(""):'<div class="box">No links here yet. Click “Add link” to get started.</div>';if(canReorder)attachDragHandlers()}
function attachDragHandlers(){document.querySelectorAll(".card[draggable=true]").forEach(card=>{card.addEventListener("dragstart",e=>{draggedId=Number(card.dataset.id);card.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(draggedId))});card.addEventListener("dragend",()=>{draggedId=null;document.querySelectorAll(".card").forEach(c=>c.classList.remove("dragging","drop-target"))});card.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";card.classList.add("drop-target")});card.addEventListener("dragleave",()=>card.classList.remove("drop-target"));card.addEventListener("drop",async e=>{e.preventDefault();card.classList.remove("drop-target");const from=draggedId??Number(e.dataTransfer.getData("text/plain")),to=Number(card.dataset.id);if(!from||!to||from===to)return;await reorder(from,to)})})}
async function reorder(fromId,toId){const visible=[...document.querySelectorAll(".card[data-id]")].map(c=>Number(c.dataset.id));const from=visible.indexOf(fromId),to=visible.indexOf(toId);if(from<0||to<0)return;visible.splice(to,0,visible.splice(from,1)[0]);const orderMap=new Map(visible.map((id,i)=>[id,i]));items=items.map(x=>orderMap.has(Number(x.id))?{...x,sort_order:orderMap.get(Number(x.id))}:x);render();const results=await Promise.all(visible.map((id,i)=>db.from("bookmarks").update({sort_order:i}).eq("id",id).eq("user_id",user.id)));const failed=results.find(r=>r.error);if(failed){alert("Could not save the new order: "+failed.error.message);await load()}}
function openEditor(id=null){editing=id;let x=id?items.find(v=>v.id===id):null;$("formTitle").textContent=x?"Edit link":"Add link";for(let k of ["name","url","description","category","icon"])$(k).value=x?.[k]||({category:"General"}[k]||"");$("favorite").checked=!!x?.favorite;$("editor").classList.remove("hidden")}
function closeEditor(){$("editor").classList.add("hidden")}
$("add").onclick=()=>openEditor();$("cancel").onclick=closeEditor;$("search").oninput=render;
$("linkForm").onsubmit=async e=>{e.preventDefault();let u=$("url").value.trim();if(!/^https?:\/\//i.test(u))u="https://"+u;const cat=$("category").value.trim()||"General";const old=editing?items.find(x=>x.id===editing):null;const sameCategory=old&&old.category===cat;const nextOrder=items.filter(x=>x.category===cat).reduce((m,x)=>Math.max(m,Number(x.sort_order)||0),-1)+1;let r={user_id:user.id,name:$("name").value.trim(),url:u,description:$("description").value.trim(),category:cat,icon:$("icon").value.trim()||$("name").value.trim()[0].toUpperCase(),favorite:$("favorite").checked,sort_order:sameCategory?(Number(old.sort_order)||0):nextOrder};let res=editing?await db.from("bookmarks").update(r).eq("id",editing).select().single():await db.from("bookmarks").insert(r).select().single();if(res.error){alert("Save failed: "+res.error.message);return}if(editing)items=items.map(x=>x.id===editing?res.data:x);else items.push(res.data);closeEditor();render()};
async function fav(id){let x=items.find(v=>v.id===id);let {data,error}=await db.from("bookmarks").update({favorite:!x.favorite}).eq("id",id).select().single();if(error){alert(error.message);return}items=items.map(v=>v.id===id?data:v);render()}
function edit(id){openEditor(id)}
async function del(id){let x=items.find(v=>v.id===id);if(!confirm(`Delete "${x.name}"?`))return;let {error}=await db.from("bookmarks").delete().eq("id",id);if(error){alert(error.message);return}items=items.filter(v=>v.id!==id);render()}
boot();
</script></body></html>
